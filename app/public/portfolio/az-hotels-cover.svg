  </text>
  <g fill="rgba(255,255,255,0.18)">
    <rect x="140" y="360" width="320" height="18" rx="9"/>
    <rect x="140" y="392" width="640" height="18" rx="9"/>
    <rect x="140" y="424" width="520" height="18" rx="9"/>
    <rect x="140" y="488" width="240" height="44" rx="22"/>
